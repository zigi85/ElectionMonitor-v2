name: Refresh election data

on:
  schedule:
    - cron: "0 */3 * * *"     # media mentions — every 3 hours
    - cron: "0 6,18 * * *"    # google trends  — every 12 hours
    - cron: "0 5 * * *"       # polls           — daily 08:00 IST
    - cron: "0 3,9,15,21 * * *"  # social signals — every 6 hours
    - cron: "30 */4 * * *"    # polymarket      — every 4 hours
    - cron: "0 4 * * *"       # daily digest    — daily 07:00 IST
  workflow_dispatch:
    inputs:
      target:
        description: "Which data to refresh"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - media
          - trends
          - polls
          - social
          - polymarket
          - digest

permissions:
  contents: write

jobs:
  refresh-media:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 */3 * * *')
      || (github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'media'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_media_mentions.py
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/media_mentions.json
          git diff --staged --quiet && echo "No changes" || (
            git commit -m "data: refresh media mentions [skip actions]" &&
            git push
          )

  refresh-trends:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 6,18 * * *')
      || (github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'trends'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install pytrends pandas
      - run: python scripts/fetch_trends.py
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/google_trends.json
          git diff --staged --quiet && echo "No changes" || (
            git commit -m "data: refresh google trends [skip actions]" &&
            git push
          )

  refresh-social:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 3,9,15,21 * * *')
      || (github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'social'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_social.py
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/social.json
          git diff --staged --quiet && echo "No changes" || (
            git commit -m "data: refresh social signals [skip actions]" &&
            git push
          )

  refresh-polymarket:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '30 */4 * * *')
      || (github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'polymarket'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install requests
      - run: python scripts/fetch_polymarket.py
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/polymarket.json
          git diff --staged --quiet && echo "No changes" || (
            git commit -m "data: refresh polymarket [skip actions]" &&
            git push
          )

  refresh-polls:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 5 * * *')
      || (github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'polls'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/scrape_polls.py
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - run: python scripts/calculate_momentum.py
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/polls.json public/data/momentum.json
          git diff --staged --quiet && echo "No changes" || (
            git commit -m "data: refresh polls [skip actions]" &&
            git push
          )

  refresh-digest:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 4 * * *')
      || (github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'digest'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install anthropic
      - run: python scripts/generate_daily_digest.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: claude-sonnet-5
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
